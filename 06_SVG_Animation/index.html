<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="string">
        <!-- https://developer.mozilla.org/en-US/docs/Web/SVG/Tutorials/SVG_from_scratch/Paths#:~:text=The%20element%20is%20the,created%20as%20elements. -->
        <svg width="1000" height="200">
            <path d="M 10 100 Q 500 100 990 100" stroke="black" fill="transparent" />
            <!-- three points -->
            <!-- M is move to point x:10 y:80  -->
            <!-- Q is for quadratic curve 
            x:95 y:10  x:180 y:80-->
         <!-- the second value of Q is the main value -->
        </svg>
    </div>
    <!-- inspiration =: https://www.brandium.nl/  -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="script.js"></script>
</body>
</html>
